<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BodyWise — Know Your Body, Feed It Right</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="app" id="app">

    <aside class="rail" id="rail">
      <div class="brand">
        <span class="brand-mark">BW</span>
        <div class="brand-text">
          <span class="brand-name">BodyWise</span>
          <span class="brand-tag">know it. feed it. keep it.</span>
        </div>
      </div>

      <nav class="organ-list" aria-label="Body parts">
        <!-- populated by JS -->
      </nav>

      <div class="rail-footer">
        <p>Every fact here is sourced from Mayo Clinic, Harvard Health, NIH, and Cleveland Clinic — not generated.</p>
        <p class="disclaimer-note">Educational use only. Not medical advice.</p>
      </div>
    </aside>

    <button class="rail-toggle" id="rail-toggle" aria-label="Hide sidebar" title="Hide sidebar">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <main class="stage">
      <div class="figure-pane">
        <svg id="body-svg" viewBox="0 0 320 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Human body diagram">
          <defs>
            <radialGradient id="figureShade" cx="50%" cy="30%" r="75%">
              <stop offset="0%" stop-color="#EDE6D8"/>
              <stop offset="100%" stop-color="#DFD5C0"/>
            </radialGradient>
          </defs>

          <!-- Body silhouette -->
          <path class="silhouette" d="
            M160,26
            C182,26 197,44 197,66
            C197,80 192,90 184,97
            C206,104 220,120 224,146
            L233,224 C235,236 227,244 216,242
            L206,240 L214,330 C216,352 212,372 200,388
            L214,430 L226,540 C228,552 220,562 208,562
            L192,562 C182,562 174,554 172,544
            L162,440 L158,440 L148,544
            C146,554 138,562 128,562
            L112,562 C100,562 92,552 94,540
            L106,430 L120,388
            C108,372 104,352 106,330
            L114,240 L104,242
            C93,244 85,236 87,224
            L96,146
            C100,120 114,104 136,97
            C128,90 123,80 123,66
            C123,44 138,26 160,26 Z
          " fill="url(#figureShade)" stroke="#C9BC9F" stroke-width="1.5"/>

          <!-- Leader lines (drawn first so markers sit above) -->
          <g class="leaders" stroke="#B9AD90" stroke-width="1" fill="none">
            <line data-leader="brain" x1="160" y1="52" x2="248" y2="40"/>
            <line data-leader="lungs" x1="145" y1="150" x2="60" y2="150"/>
            <line data-leader="heart" x1="168" y1="168" x2="252" y2="182"/>
            <line data-leader="liver" x1="150" y1="205" x2="60" y2="228"/>
            <line data-leader="kidneys" x1="178" y1="222" x2="252" y2="270"/>
            <line data-leader="gut" x1="160" y1="245" x2="60" y2="320"/>
          </g>

          <!-- Organ markers on the body -->
          <g class="markers">
            <circle class="organ-marker" data-organ="brain" cx="160" cy="52" r="7"/>
            <circle class="organ-marker" data-organ="lungs" cx="145" cy="150" r="7"/>
            <circle class="organ-marker" data-organ="heart" cx="168" cy="168" r="7"/>
            <circle class="organ-marker" data-organ="liver" cx="150" cy="205" r="7"/>
            <circle class="organ-marker" data-organ="kidneys" cx="178" cy="222" r="7"/>
            <circle class="organ-marker" data-organ="gut" cx="160" cy="245" r="7"/>
          </g>

          <!-- Label chips at the end of leader lines -->
          <g class="chips" font-family="'Public Sans', sans-serif" font-size="13" font-weight="600">
            <g class="chip" data-organ="brain" transform="translate(250,40)"><text>Brain</text></g>
            <g class="chip" data-organ="lungs" transform="translate(4,150)" text-anchor="start"><text>Lungs</text></g>
            <g class="chip" data-organ="heart" transform="translate(254,182)"><text>Heart</text></g>
            <g class="chip" data-organ="liver" transform="translate(4,228)"><text>Liver</text></g>
            <g class="chip" data-organ="kidneys" transform="translate(254,270)"><text>Kidneys</text></g>
            <g class="chip" data-organ="gut" transform="translate(4,320)"><text>Gut</text></g>
          </g>
        </svg>
        <p class="figure-hint">Tap a marker or choose from the list</p>
      </div>

      <section class="detail-pane" id="detail-pane" aria-live="polite">
        <div class="empty-state">Select a body part to begin.</div>
      </section>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
